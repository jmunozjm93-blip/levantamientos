<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a3a6b">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Levantamientos">
<title>Levantamientos · Grupo Depor</title>
<style>
:root{
  --azul:#1a3a6b; --azul2:#2d6a9f; --azul3:#eaf1fb; --rojo:#e74c3c;
  --bg:#f3f5f9; --card:#ffffff; --line:#e3e8f0; --line2:#d3dae6; --text:#1f2937; --muted:#6b7280; --muted2:#9aa3b2;
  --input:#f8fafd; --hover:#f5f8fd; --barra:#bfd4ee; --sombra:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
  --chip:#eef2f8; --chipt:#1a3a6b; --foto:#ffffff;
  --r:14px;
}
@media(prefers-color-scheme:dark){:root{
  --azul:#8ec5ff; --azul2:#5ea3e6; --azul3:#1b2a44; --rojo:#f0645a;
  --bg:#0f1218; --card:#171b23; --line:#262c38; --line2:#323a48; --text:#e6e9ef; --muted:#9aa3b2; --muted2:#6b7280;
  --input:#0f131a; --hover:#1c2129; --barra:#2b4a74; --sombra:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  --chip:#222938; --chipt:#cfe2ff; --foto:#ffffff;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.35;padding-bottom:env(safe-area-inset-bottom);}
a{color:var(--azul2);}
button,select,input{font-family:inherit;}

/* ---------- cabecera: carrusel de marcas ---------- */
.hero{position:relative;height:clamp(150px,24vw,340px);background:#111;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.25);}
.hero .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pd,center);opacity:0;transition:opacity 1.1s ease;will-change:opacity;}
.hero .slide.on{opacity:1;}
.hero .dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:7px;z-index:2;}
.hero .dots button{width:22px;height:4px;border:0;border-radius:2px;background:rgba(255,255,255,.4);cursor:pointer;padding:0;transition:background .3s,width .3s;}
.hero .dots button.on{background:#fff;width:34px;}
.hero .arr{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:1.3rem;line-height:36px;cursor:pointer;opacity:0;transition:opacity .2s;padding:0;}
.hero:hover .arr{opacity:1;}
.hero .arr.l{left:14px;}.hero .arr.r{right:14px;}
.wrap{max-width:1280px;margin:0 auto;padding:14px 20px 40px;}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px;font-size:.78rem;color:var(--muted);}
.top .cl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;}
.top a{font-weight:600;text-decoration:none;}
.top a:hover{text-decoration:underline;}

/* ---------- paneles ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sombra);}
.filtros{padding:14px 16px 12px;margin-bottom:14px;}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
.fhead h2{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.ftoggle{display:none;}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr) 1.4fr auto;gap:10px 12px;align-items:end;}
.fg{display:flex;flex-direction:column;gap:5px;min-width:0;}
.fg label{font-size:.7rem;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:.06em;}
.fg select,.fg input{width:100%;padding:10px 12px;border:1.5px solid var(--line2);border-radius:10px;font-size:.92rem;background:var(--input);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;appearance:none;-webkit-appearance:none;}
.fg select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px;}
.fg select:focus,.fg input:focus{border-color:var(--azul2);box-shadow:0 0 0 3px rgba(45,106,159,.18);}
.fg .buscar{position:relative;}
.fg .buscar input{padding-left:34px;}
.fg .buscar svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted2);}
.btn-r{padding:10px 16px;background:transparent;color:var(--rojo);border:1.5px solid var(--rojo);border-radius:10px;cursor:pointer;font-size:.88rem;font-weight:700;white-space:nowrap;transition:background .15s,color .15s;}
.btn-r:hover{background:var(--rojo);color:#fff;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.chips:empty{display:none;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--chipt);border-radius:999px;padding:5px 8px 5px 11px;font-size:.78rem;font-weight:600;}
.chip small{font-weight:500;opacity:.75;}
.chip b{font-weight:700;}
.chip button{border:0;background:rgba(0,0,0,.08);color:inherit;width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:.8rem;line-height:18px;padding:0;}
.chip button:hover{background:var(--rojo);color:#fff;}

/* ---------- indicadores ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;}
.kpi .l{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.kpi .v{font-size:1.7rem;font-weight:800;color:var(--azul);letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums;}
.kpi .s{font-size:.75rem;color:var(--muted);}
.kpi.main{background:linear-gradient(135deg,#1a3a6b,#2d6a9f);border-color:transparent;}
.kpi.main .l,.kpi.main .s{color:rgba(255,255,255,.75);}
.kpi.main .v{color:#fff;}
.pc{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.pc:empty{display:none;}
.pc .cc{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:.8rem;box-shadow:var(--sombra);}
.pc .cc b{font-variant-numeric:tabular-nums;}
.pc .cc small{color:var(--muted);}

/* ---------- etiquetas de cliente ---------- */
.bc{display:inline-block;padding:3px 9px;border-radius:999px;font-size:.7rem;font-weight:700;white-space:nowrap;letter-spacing:.01em;}
.bf{background:#d4edff;color:#0056b3;}.br{background:#ffe4d4;color:#b33000;}.bp{background:#d4f5e0;color:#006b2e;}.ba{background:#ede4ff;color:#5b2a9e;}
.bl{background:#fde2e2;color:#b91c1c;}.bh{background:#dfe3f3;color:#14224a;}
@media(prefers-color-scheme:dark){
  .bf{background:#12365a;color:#8ec5ff;}.br{background:#4a2410;color:#ffb38a;}.bp{background:#0f3d24;color:#7be0a3;}.ba{background:#2f1f55;color:#c9b3ff;}
  .bl{background:#4a1a1a;color:#ff9b9b;}.bh{background:#22304f;color:#b9c6ea;}
}

/* ---------- tabla ---------- */
.tabla{overflow:hidden;}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:.82rem;color:var(--muted);}
.tbar b{color:var(--text);}
.fo{display:none;}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 120px);overflow-y:auto;}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.86rem;}
thead th{position:sticky;top:0;z-index:2;background:var(--card);color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;}
thead th:hover{color:var(--azul);}
th.ns{cursor:default;}th.ns:hover{color:var(--muted);}
th.sa::after{content:" ▲";font-size:.65em;color:var(--azul);}
th.sd::after{content:" ▼";font-size:.65em;color:var(--azul);}
th.n,td.n{text-align:right;}
tbody td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:0;}
tbody tr:hover td{background:var(--hover);}
.tc{width:70px;padding:6px 8px 6px 14px!important;}
.foto{width:54px;height:54px;border-radius:8px;border:1px solid var(--line);background:var(--foto);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted2);font-size:.62rem;}
.foto img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;display:block;}
.mod{font-weight:700;color:var(--azul);white-space:nowrap;}
.desc{font-size:.78rem;color:var(--muted);margin-top:2px;}
.dim{color:var(--muted);}
.cant{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:130px;}
.cant b{font-variant-numeric:tabular-nums;font-size:.95rem;color:var(--azul);min-width:38px;text-align:right;}
.bar{width:70px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--azul2),var(--azul));border-radius:3px;}
.nr,.msg{text-align:center;padding:40px 16px;color:var(--muted);}
.msg.err{color:var(--rojo);}

/* ---------- paginación ---------- */
.pag{display:flex;justify-content:center;align-items:center;gap:5px;padding:12px 10px;border-top:1px solid var(--line);flex-wrap:wrap;}
.pag:empty{display:none;}
.pag button{padding:8px 12px;border:1.5px solid var(--line2);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;font-size:.85rem;min-height:38px;min-width:38px;}
.pag button.act{background:var(--azul);color:#fff;border-color:var(--azul);font-weight:700;}
@media(prefers-color-scheme:dark){.pag button.act{color:#0f1218;}}
.pag button:disabled{opacity:.4;}
.pi{font-size:.82rem;color:var(--muted);margin-left:6px;}

/* ---------- tarjetas (celular) ---------- */
.cards{display:none;padding:10px;}
.card{display:grid;grid-template-columns:64px 1fr;gap:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:var(--sombra);}
.card .foto{grid-row:1/4;width:64px;height:64px;}
.card .crow{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.card .crow .mod{font-size:.95rem;white-space:normal;word-break:break-all;}
.card .cdesc{font-size:.8rem;color:var(--text);line-height:1.3;}
.card .cmeta{font-size:.72rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;}
.card .cant{min-width:0;}
.card .bar{width:56px;}

/* ---------- detalle por tienda (panel al tocar un modelo) ---------- */
tbody tr,.card{cursor:pointer;}
.sh{display:none;position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:900;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);}
.sh.open{display:flex;}
.sheet{background:var(--card);color:var(--text);width:100%;max-width:560px;max-height:88vh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease-out;}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.sh-h{display:flex;gap:14px;padding:16px 16px 12px;border-bottom:1px solid var(--line);align-items:flex-start;}
.sh-h .foto{width:96px;height:96px;flex:none;border-radius:12px;}
.sh-h .info{flex:1;min-width:0;}
.sh-h .mod{font-size:1.15rem;white-space:normal;word-break:break-all;}
.sh-h .desc{font-size:.85rem;margin:2px 0 8px;}
.sh-h .tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:.74rem;color:var(--muted);}
.sh-x{border:0;background:var(--chip);color:var(--text);width:32px;height:32px;border-radius:50%;font-size:1.3rem;line-height:32px;cursor:pointer;flex:none;padding:0;}
.sh-x:hover{background:var(--rojo);color:#fff;}
.sh-t{display:flex;justify-content:space-between;align-items:baseline;padding:10px 16px 6px;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;}
.sh-t b{color:var(--azul);font-size:1rem;letter-spacing:0;text-transform:none;}
.sh-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px 8px;}
.tl{display:grid;grid-template-columns:1fr auto auto;gap:2px 12px;align-items:center;padding:9px 8px;border-radius:10px;}
.tl:hover{background:var(--hover);}
.tl .tn{grid-column:1;grid-row:1;font-weight:600;font-size:.88rem;}
.tl .ts{grid-column:1;grid-row:2;font-size:.72rem;color:var(--muted);}
.tl .bar{grid-column:2;grid-row:1/3;width:64px;}
.tl .tq{grid-column:3;grid-row:1/3;font-weight:800;color:var(--azul);font-variant-numeric:tabular-nums;min-width:34px;text-align:right;font-size:.95rem;}
.tl.neg .tq{color:var(--rojo);}
.sh-f{padding:10px 16px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.sh-f b{color:var(--text);}
@media(max-width:640px){
  .sh{padding:0;align-items:flex-end;}
  .sheet{max-width:none;max-height:92vh;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:up .22s ease-out;}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0;}
  .sh-h .foto{width:80px;height:80px;}
}

/* ---------- foto ampliada ---------- */
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:999;align-items:center;justify-content:center;padding:20px;}
.lb.open{display:flex;}
.lb img{max-width:92vw;max-height:88vh;border-radius:10px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);}
.lbx{position:absolute;top:16px;right:22px;color:#fff;font-size:2.4rem;font-weight:300;cursor:pointer;line-height:1;}

/* ---------- pantallas medianas ---------- */
@media(max-width:1000px){
  .fgrid{grid-template-columns:repeat(3,1fr);}
  .fgrid .full{grid-column:1/3;}
  .kpis{grid-template-columns:repeat(2,1fr);}
}
/* ---------- celular (iPhone / Android) ---------- */
@media(max-width:640px){
  .hero{height:clamp(150px,44vw,200px);}
  .hero .slide{object-position:var(--pm,center);}
  .hero .arr{display:none;}
  .wrap{padding:10px 10px 30px;}
  .top{font-size:.72rem;margin-bottom:10px;}
  .filtros{padding:12px 12px 10px;}
  .fgrid{grid-template-columns:1fr 1fr;gap:10px;}
  .fgrid .full{grid-column:1/-1;}
  .fgrid .btn-r{grid-column:1/-1;}
  .fg select,.fg input{font-size:16px;} /* 16px evita que iOS haga zoom al tocar un filtro */
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px;}
  .kpi{padding:10px 12px;}
  .kpi .v{font-size:1.35rem;}
  .pc{gap:6px;margin-bottom:10px;}
  .pc .cc{font-size:.74rem;padding:4px 10px 4px 5px;}
  .tbar{padding:10px 12px;}
  .fo{display:inline-block;font-size:.8rem;padding:6px 28px 6px 8px;border:1.5px solid var(--line2);border-radius:8px;background:var(--input);color:var(--azul);max-width:60%;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .tw{display:none;}
  .cards{display:block;}
  .tabla{background:transparent;border:0;box-shadow:none;}
  .tabla .tbar{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sombra);margin-bottom:0;}
  .cards{padding:8px 0 0;}
  .pag{border:0;padding-top:4px;}
  .nr,.msg{background:var(--card);border-radius:12px;margin-top:8px;}
}
</style>
</head>
<body>
<header class="hero" id="hero">
  <img class="slide on" src="img/converse.jpg" alt="Converse" style="--pd:center;--pm:18% center">
  <img class="slide" src="img/fila.jpg" alt="Fila" loading="lazy" style="--pd:center;--pm:70% center">
  <img class="slide" src="img/umbro.jpg" alt="Umbro" loading="lazy" style="--pd:center 100%;--pm:75% 100%">
  <button class="arr l" onclick="heroIr(-1)" aria-label="Anterior">&#8249;</button>
  <button class="arr r" onclick="heroIr(1)" aria-label="Siguiente">&#8250;</button>
  <div class="dots" id="dots"></div>
</header>

<div class="wrap">
  <div class="top"><div class="cl" id="meta">Cargando levantamientos…</div><a href="cargar.html">Cargar levantamiento →</a></div>

  <section class="panel filtros" id="filtros">
    <div class="fhead"><h2>Filtros</h2></div>
    <div class="fgrid">
      <div class="fg"><label>Supervisor</label><select id="fs"></select></div>
      <div class="fg"><label>Cliente</label><select id="fc"></select></div>
      <div class="fg"><label>Tienda</label><select id="ft"></select></div>
      <div class="fg"><label>Departamento</label><select id="fd"></select></div>
      <div class="fg full"><label>Buscar</label><div class="buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="text" id="fq" placeholder="Modelo o descripción…" autocomplete="off"></div></div>
      <button class="btn-r" onclick="resetF()">✕ Limpiar</button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="kpis">
    <div class="panel kpi main"><span class="l">Unidades</span><span class="v" id="kUds">0</span><span class="s" id="kUdsS">&nbsp;</span></div>
    <div class="panel kpi"><span class="l">SKUs</span><span class="v" id="kSku">0</span><span class="s" id="kSkuS">&nbsp;</span></div>
    <div class="panel kpi"><span class="l">Tiendas</span><span class="v" id="kTie">0</span><span class="s" id="kTieS">&nbsp;</span></div>
    <div class="panel kpi"><span class="l">Marcas</span><span class="v" id="kMar">0</span><span class="s" id="kMarS">&nbsp;</span></div>
  </section>
  <div class="pc" id="pc"></div>

  <section class="panel tabla">
    <div class="tbar"><span id="tinfo">Cargando…</span>
      <select class="fo" id="fo" onchange="ordenarMovil(this.value)">
        <option value="">Ordenar…</option>
        <option value="6d">Cantidad ↓</option>
        <option value="6a">Cantidad ↑</option>
        <option value="2a">Modelo A–Z</option>
        <option value="3a">Descripción A–Z</option>
        <option value="0a">Cliente</option>
        <option value="1a">Departamento</option>
        <option value="5a">Marca</option>
        <option value="4a">Temporada</option>
      </select>
    </div>
    <div class="tw">
      <table>
        <thead><tr>
          <th class="ns">Foto</th>
          <th data-col="2" onclick="sortBy(2)">Modelo</th>
          <th data-col="0" onclick="sortBy(0)">Cliente</th>
          <th data-col="1" onclick="sortBy(1)">Dpto.</th>
          <th data-col="4" onclick="sortBy(4)">Temporada</th>
          <th data-col="5" onclick="sortBy(5)">Marca</th>
          <th data-col="6" class="n" onclick="sortBy(6)">Cantidad</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="cards" id="cards"></div>
    <div class="msg" id="cargando">Cargando datos…</div>
    <div class="nr" id="nr" style="display:none">Sin resultados para estos filtros.</div>
    <div class="pag" id="pg"></div>
  </section>
</div>
<div class="sh" id="sh" onclick="cerrarDetalle()"><div class="sheet" onclick="event.stopPropagation()">
  <div class="sh-h" id="shH"></div>
  <div class="sh-t"><span>Tiendas con stock</span><b id="shTot"></b></div>
  <div class="sh-b" id="shB"></div>
  <div class="sh-f" id="shF"></div>
</div></div>
<div class="lb" id="lb" onclick="closeLB()"><span class="lbx" onclick="closeLB()">&times;</span><img id="lbimg" src="" alt="" onclick="event.stopPropagation()"></div>

<script>
// ---------- carrusel de la cabecera: fundido cada 5 s, puntos, flechas y deslizar en el celular ----------
(function(){
  var hero=document.getElementById('hero'), slides=hero.querySelectorAll('.slide'), dots=document.getElementById('dots');
  var i=0, n=slides.length, timer=null;
  dots.innerHTML=Array.prototype.map.call(slides,function(_,k){ return '<button class="'+(k===0?'on':'')+'" onclick="heroA('+k+')" aria-label="Imagen '+(k+1)+'"></button>'; }).join('');
  function ir(k){
    i=(k+n)%n;
    slides.forEach(function(s,j){ s.classList.toggle('on',j===i); });
    dots.querySelectorAll('button').forEach(function(d,j){ d.classList.toggle('on',j===i); });
  }
  function arrancar(){ clearInterval(timer); timer=setInterval(function(){ ir(i+1); },5000); }
  window.heroIr=function(d){ ir(i+d); arrancar(); };
  window.heroA=function(k){ ir(k); arrancar(); };
  hero.addEventListener('mouseenter',function(){ clearInterval(timer); });
  hero.addEventListener('mouseleave',arrancar);
  var x0=null;
  hero.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
  hero.addEventListener('touchend',function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>40) window.heroIr(dx<0?1:-1); },{passive:true});
  document.addEventListener('visibilitychange',function(){ if(document.hidden) clearInterval(timer); else arrancar(); });
  arrancar();
})();

// ---------- datos: se descargan desde data/ (publicado por cargar.html) ----------
// Estructura interna, la misma del archivo original:
//   RAW[i] = [cliente, depto, modelo, descripcion, temporada, marca, cantidad, foto, supervisores[], tiendas[], {tienda: cantidad}]
//   (cliente, depto, temporada, marca, supervisores y tiendas son índices en C, D, T, M, S y TI)
//   SM["cliente_depto_tienda"] = índice del supervisor de esa tienda
var C=[], D=[], T=[], M=[], S=[], TI=[], RAW=[], SM={}, IMGS={};
var IMG='https://drive.google.com/thumbnail?id=';
var PS=50, CP=1, SC=-1, SD=1, AT=-1, SI=-1;
var F=[];
var BGCLS={'Falabella':'bf','Ripley':'br','Paris':'bp','ABC':'ba','La Polar':'bl','Hites':'bh'};
var ORDEN_CLIENTES=['Falabella','La Polar','Paris','Ripley','Hites'];
var fmt=function(n){ return Number(n).toLocaleString('es-CL'); };

function fechaCorta(iso){ if(!iso) return ''; var d=new Date(iso); return d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'}); }

async function cargar(){
  var r=await fetch('data/manifiesto.json?t='+Date.now());
  if(!r.ok) throw new Error('No encuentro data/manifiesto.json');
  var man=await r.json();
  var claves=Object.keys(man.clientes||{});
  if(!claves.length) throw new Error('Todavía no hay levantamientos cargados. Súbelos desde cargar.html.');
  var pedidos=claves.map(function(k){ return fetch('data/clientes/'+k+'.json?v='+encodeURIComponent(man.clientes[k].subido||'')).then(function(x){ if(!x.ok) throw new Error('Falta data/clientes/'+k+'.json'); return x.json(); }); });
  if(man.imagenes) pedidos.push(fetch('data/imagenes.json?v='+encodeURIComponent(man.imagenes.subido||'')).then(function(x){ return x.ok?x.json():{img:{}}; }).then(function(j){ IMGS=j.img||{}; }));
  var clientes=(await Promise.all(pedidos)).filter(function(j){ return j && j.filas; });
  clientes.sort(function(a,b){ var ia=ORDEN_CLIENTES.indexOf(a.cliente), ib=ORDEN_CLIENTES.indexOf(b.cliente); return (ia<0?99:ia)-(ib<0?99:ib) || a.cliente.localeCompare(b.cliente); });
  construir(clientes, man);
}

// arma C/D/T/M/S/TI/RAW/SM a partir de los JSON por cliente
function construir(clientes, man){
  var idx=function(lista, mapa, v){ if(mapa[v]===undefined){ mapa[v]=lista.length; lista.push(v); } return mapa[v]; };
  var mD={}, mT={}, mM={}, mS={}, mTI={};
  var dep=[], tem=[], mar=[], sup=[], tie=[];
  // listas ordenadas alfabéticamente, como el archivo original
  clientes.forEach(function(c){
    c.filas.forEach(function(f){ idx(dep,mD,f.d); idx(tem,mT,f.t); idx(mar,mM,f.b); });
    c.tiendas.forEach(function(t){ idx(sup,mS,t.sup); idx(tie,mTI,t.nombre); });
  });
  var ordenar=function(lista, mapa){ lista.sort(function(a,b){ return a.localeCompare(b,'es',{numeric:false}); }); lista.forEach(function(v,i){ mapa[v]=i; }); };
  ordenar(dep,mD); ordenar(tem,mT); ordenar(mar,mM); ordenar(sup,mS); ordenar(tie,mTI);
  D=dep; T=tem; M=mar; S=sup; TI=tie;
  C=clientes.map(function(c){ return c.cliente; });
  RAW=[]; SM={};
  clientes.forEach(function(c, ci){
    var porCod={};
    c.tiendas.forEach(function(t){ porCod[t.cod]={ ti:mTI[t.nombre], si:mS[t.sup] }; });
    var deptos={};
    c.filas.forEach(function(f){ deptos[mD[f.d]]=1; });
    Object.keys(deptos).forEach(function(di){ c.tiendas.forEach(function(t){ var p=porCod[t.cod]; SM[ci+'_'+di+'_'+p.ti]=p.si; }); });
    c.filas.forEach(function(f){
      var tiendas=[], sups={}, det={};
      Object.keys(f.s).forEach(function(cod){ var p=porCod[cod]; if(!p) return; tiendas.push(p.ti); det[String(p.ti)]=f.s[cod]; sups[p.si]=1; });
      tiendas.sort(function(a,b){return a-b;});
      var img=IMGS[f.m.toUpperCase()]||'';
      RAW.push([ci, mD[f.d], f.m, f.n, mT[f.t], mM[f.b], f.q, img, Object.keys(sups).map(Number).sort(function(a,b){return a-b;}), tiendas, det, RAW.length]);
    });
  });
  F=RAW.slice();
  // línea de resumen: semana del Excel y fecha de carga; los clientes con la misma se agrupan
  var grupos={}, orden=[];
  clientes.forEach(function(c){
    var sem={}; c.hojas.forEach(function(x){ var s=(x.semana||'').split('|')[0].trim(); if(s) sem[s]=1; });
    var reg=(man.clientes||{})[c.clave]||{};
    var k=Object.keys(sem).join(', ')+(reg.subido?' · cargado '+fechaCorta(reg.subido):'');
    if(!grupos[k]){ grupos[k]=[]; orden.push(k); }
    grupos[k].push(badgeFor(c.cliente));
  });
  document.getElementById('meta').innerHTML=orden.map(function(k){ return '<span>'+grupos[k].join(' ')+' '+k+'</span>'; }).join('');
  document.getElementById('cargando').style.display='none';
  initFiltros();
  render();
}

function supOf(ci,di,ti){
  var v=SM[ci+'_'+di+'_'+ti];
  return v===undefined?-1:v;
}
function rowHasSup(r,si){
  for(var i=0;i<r[9].length;i++){ if(supOf(r[0],r[1],r[9][i])===si) return true; }
  return false;
}
function badgeFor(name){return '<span class="bc '+(BGCLS[name]||'bf')+'">'+name+'</span>';}
function fotoDe(r, sz){ return '<div class="foto">'+(r[7]?'<img src="'+IMG+r[7]+'&sz=w'+sz+'" loading="lazy" onclick="openLB(\''+r[7]+'\')" alt="">':'sin foto')+'</div>'; }

function openLB(id){
  if(!id) return;
  document.getElementById('lbimg').src=IMG+id+'&sz=w1000';
  document.getElementById('lb').classList.add('open');
}
function closeLB(){
  document.getElementById('lb').classList.remove('open');
  document.getElementById('lbimg').src='';
}
document.addEventListener('keydown',function(e){ if(e.key!=='Escape') return; if(document.getElementById('lb').classList.contains('open')) closeLB(); else cerrarDetalle(); });

// ---------- detalle por tienda: panel con la foto grande y las tiendas del modelo ----------
// respeta el supervisor y la tienda elegidos en los filtros (muestra solo esas tiendas)
function abrirDetalle(i){
  var r=RAW[i]; if(!r) return;
  var ci=r[0], di=r[1];
  var lista=[], sum=0;
  r[9].forEach(function(t){
    var s=supOf(ci,di,t);
    if(SI>=0 && s!==SI) return;
    if(AT>=0 && t!==AT) return;
    var q=r[10][String(t)]||0;
    lista.push({t:t,s:s,q:q}); sum+=q;
  });
  lista.sort(function(a,b){ return b.q-a.q || TI[a.t].localeCompare(TI[b.t]); });
  var maxQ=lista.reduce(function(m,x){return Math.max(m,x.q);},0);
  document.getElementById('shH').innerHTML=fotoDe(r,400)
    +'<div class="info"><div class="mod">'+r[2]+'</div><div class="desc">'+r[3]+'</div>'
    +'<div class="tags">'+badgeFor(C[ci])+'<span>'+D[di]+'</span><span>·</span><span>'+T[r[4]]+'</span><span>·</span><span>'+M[r[5]]+'</span></div></div>'
    +'<button class="sh-x" onclick="cerrarDetalle()" title="Cerrar">×</button>';
  document.getElementById('shTot').textContent=fmt(sum)+' uds. en '+lista.length+(lista.length===1?' tienda':' tiendas');
  document.getElementById('shB').innerHTML=lista.length?lista.map(function(x){
    return '<div class="tl'+(x.q<0?' neg':'')+'"><span class="tn">'+TI[x.t]+'</span><span class="bar"><i style="width:'+(maxQ>0&&x.q>0?Math.max(2,Math.round(x.q/maxQ*100)):0)+'%"></i></span><span class="tq">'+fmt(x.q)+'</span><span class="ts">'+(x.s>=0?S[x.s]:'sin supervisor')+'</span></div>';
  }).join(''):'<div class="nr">Sin tiendas con stock para estos filtros.</div>';
  var f=[];
  if(sum!==r[6]) f.push('En todas sus tiendas: <b>'+fmt(r[6])+' uds.</b> en '+r[9].length);
  if(SI>=0) f.push('Supervisor: <b>'+S[SI]+'</b>');
  document.getElementById('shF').innerHTML=f.join('<span></span>')||'Toca la foto para ampliarla';
  document.getElementById('sh').classList.add('open');
  document.body.style.overflow='hidden';
}
function cerrarDetalle(){
  document.getElementById('sh').classList.remove('open');
  document.body.style.overflow='';
}

function gi(id){return parseInt(document.getElementById(id).value);}

function setSelect(id, idxArr, lookup, ph, keepVal){
  var h='<option value="-1">'+ph+'</option>';
  idxArr.forEach(function(i){h+='<option value="'+i+'">'+lookup[i]+'</option>';});
  var el=document.getElementById(id);
  el.innerHTML=h;
  if(keepVal>=0 && idxArr.indexOf(keepVal)>=0) el.value=keepVal;
}

// Filtros en cascada, en este orden: Supervisor → Cliente → Tienda → Departamento.
// Cada lista muestra solo lo que existe para lo elegido en las listas anteriores
// (al elegir un supervisor, en Tienda quedan únicamente sus tiendas).
var ORDEN_FILTROS=['fs','fc','ft','fd'];
var PLACEHOLDER={fs:'Todos',fc:'Todos',ft:'Todas',fd:'Todos'};
var NOMBRE_FILTRO={fs:'Supervisor',fc:'Cliente',ft:'Tienda',fd:'Departamento'};

// opciones disponibles para la lista `id` según lo elegido en las listas que van antes
function disponibles(id, cons){
  var set={};
  RAW.forEach(function(r){
    if(cons.ci>=0 && r[0]!==cons.ci) return;
    if(cons.di>=0 && r[1]!==cons.di) return;
    r[9].forEach(function(t){
      if(cons.ti>=0 && t!==cons.ti) return;
      var s=supOf(r[0],r[1],t);
      if(s<0) return;
      if(cons.si>=0 && s!==cons.si) return;
      set[id==='fs'?s:id==='fc'?r[0]:id==='ft'?t:r[1]]=1;
    });
  });
  return Object.keys(set).map(Number).sort(function(a,b){return a-b;});
}

// recalcula las listas que vienen después de `desde` (todas si no se indica), conservando la elección si sigue válida
function refreshDropdowns(desde){
  var k0=desde?ORDEN_FILTROS.indexOf(desde)+1:0;
  for(var k=k0;k<ORDEN_FILTROS.length;k++){
    var id=ORDEN_FILTROS[k], cons={si:-1,ci:-1,ti:-1,di:-1};
    for(var j=0;j<k;j++){
      var v=gi(ORDEN_FILTROS[j]);
      if(ORDEN_FILTROS[j]==='fs') cons.si=v; else if(ORDEN_FILTROS[j]==='fc') cons.ci=v; else if(ORDEN_FILTROS[j]==='ft') cons.ti=v; else cons.di=v;
    }
    var av=disponibles(id,cons), cur=gi(id);
    setSelect(id,av,{fs:S,fc:C,ft:TI,fd:D}[id],PLACEHOLDER[id],av.indexOf(cur)>=0?cur:-1);
  }
}

function getQ(r){
  if(AT>=0 && r[10][String(AT)]!==undefined) return r[10][String(AT)];
  if(SI>=0){
    var tot=0;
    r[9].forEach(function(t){
      if(supOf(r[0],r[1],t)===SI) tot+=(r[10][String(t)]||0);
    });
    return tot;
  }
  return r[6];
}

function applyF(){
  var ci=gi('fc'), di=gi('fd'), si=gi('fs'), q=document.getElementById('fq').value.toLowerCase().trim();
  AT=gi('ft'); SI=si;
  F=RAW.filter(function(r){
    return (ci<0||r[0]===ci)&&(di<0||r[1]===di)&&(si<0||rowHasSup(r,si))
          &&(AT<0||r[9].indexOf(AT)>=0)&&(!q||r[2].toLowerCase().indexOf(q)>=0||r[3].toLowerCase().indexOf(q)>=0);
  });
  if(SC>=0) doSort(SC);
  CP=1; render();
}

function initFiltros(){
  ORDEN_FILTROS.forEach(function(id){document.getElementById(id).innerHTML='<option value="-1">'+PLACEHOLDER[id]+'</option>';});
  refreshDropdowns();
}

ORDEN_FILTROS.forEach(function(id){
  document.getElementById(id).addEventListener('change',function(){refreshDropdowns(id);applyF();});
});
document.getElementById('fq').addEventListener('input',applyF);

// quitar un filtro desde su chip
function quitar(id){
  if(id==='fq'){ document.getElementById('fq').value=''; applyF(); return; }
  document.getElementById(id).value='-1';
  refreshDropdowns(id); applyF();
}
function renderChips(){
  var h='', n=0;
  ORDEN_FILTROS.forEach(function(id){
    var v=gi(id); if(v<0) return; n++;
    var txt={fs:S,fc:C,ft:TI,fd:D}[id][v];
    h+='<span class="chip"><small>'+NOMBRE_FILTRO[id]+':</small><b>'+txt+'</b><button onclick="quitar(\''+id+'\')" title="Quitar">×</button></span>';
  });
  var q=document.getElementById('fq').value.trim();
  if(q){ n++; h+='<span class="chip"><small>Buscar:</small><b>'+q.replace(/</g,'&lt;')+'</b><button onclick="quitar(\'fq\')" title="Quitar">×</button></span>'; }
  document.getElementById('chips').innerHTML=h;
}

function sortBy(col){
  if(SC===col) SD*=-1; else{SC=col;SD=1;}
  marcarOrden(); doSort(col); render();
}
function marcarOrden(){
  document.querySelectorAll('thead th').forEach(function(t){ t.classList.remove('sa','sd'); if(SC>=0 && String(t.getAttribute('data-col'))===String(SC)) t.classList.add(SD===1?'sa':'sd'); });
}
function doSort(col){
  F.sort(function(a,b){
    var va,vb;
    if(col===0){va=C[a[0]];vb=C[b[0]];}
    else if(col===1){va=D[a[1]];vb=D[b[1]];}
    else if(col===4){va=T[a[4]];vb=T[b[4]];}
    else if(col===5){va=M[a[5]];vb=M[b[5]];}
    else if(col===6){va=getQ(a);vb=getQ(b);}
    else{va=a[col];vb=b[col];}
    if(typeof va==='number') return (va-vb)*SD;
    return String(va).localeCompare(String(vb))*SD;
  });
}

// indicadores de lo filtrado: unidades, SKUs, tiendas con stock y marcas; más el desglose por cliente
function renderKpis(tot){
  var tiendas={}, marcas={}, porCli={}, maxQ=0;
  F.forEach(function(r){
    var q=getQ(r); if(q>maxQ) maxQ=q;
    marcas[r[5]]=1;
    porCli[r[0]]=(porCli[r[0]]||0)+q;
    r[9].forEach(function(t){ if((AT<0||t===AT)&&(SI<0||supOf(r[0],r[1],t)===SI)) tiendas[t]=1; });
  });
  var nT=Object.keys(tiendas).length, nM=Object.keys(marcas).length;
  document.getElementById('kUds').textContent=fmt(tot);
  document.getElementById('kUdsS').textContent=F.length===RAW.length?'en todos los levantamientos':'con los filtros aplicados';
  document.getElementById('kSku').textContent=fmt(F.length);
  document.getElementById('kSkuS').textContent='de '+fmt(RAW.length)+' en total';
  document.getElementById('kTie').textContent=fmt(nT);
  document.getElementById('kTieS').textContent=nT===1?TI[Object.keys(tiendas)[0]]:'con stock';
  document.getElementById('kMar').textContent=fmt(nM);
  document.getElementById('kMarS').textContent=nM<=3&&nM>0?Object.keys(marcas).map(function(i){return M[i];}).join(' · '):' ';
  var cli=Object.keys(porCli).map(Number).sort(function(a,b){return a-b;}).filter(function(ci){return porCli[ci]>0;});
  document.getElementById('pc').innerHTML=cli.length>1?cli.map(function(ci){ return '<span class="cc">'+badgeFor(C[ci])+'<b>'+fmt(porCli[ci])+'</b><small>uds · '+Math.round(porCli[ci]/tot*100)+'%</small></span>'; }).join(''):'';
  return maxQ;
}

function render(){
  var st=(CP-1)*PS, pg=F.slice(st,st+PS);
  var tot=F.reduce(function(s,r){return s+getQ(r);},0);
  var maxQ=renderKpis(tot);
  renderChips();
  var tb=document.getElementById('tb'), cards=document.getElementById('cards');
  MODO_DIBUJADO=MOVIL.matches;
  document.getElementById('nr').style.display=F.length===0?'block':'none';
  document.getElementById('tinfo').innerHTML=F.length?'<b>'+fmt(F.length)+'</b> SKUs · <b>'+fmt(tot)+'</b> uds.'+(F.length>PS?' · página '+CP+' de '+Math.ceil(F.length/PS):''):'Sin resultados';
  tb.innerHTML=''; cards.innerHTML='';
  var cant=function(r){ var q=getQ(r); return '<div class="cant"><span class="bar"><i style="width:'+(maxQ>0?Math.max(2,Math.round(q/maxQ*100)):0)+'%"></i></span><b>'+fmt(q)+'</b></div>'; };
  if(F.length && MOVIL.matches){
    // celular: tarjetas (la tabla queda oculta por CSS)
    cards.innerHTML=pg.map(function(r){
      return '<div class="card" onclick="abrirDetalle('+r[11]+')">'+fotoDe(r,160)
        +'<div class="crow"><span class="mod">'+r[2]+'</span>'+cant(r)+'</div>'
        +'<div class="cdesc">'+r[3]+'</div>'
        +'<div class="cmeta">'+badgeFor(C[r[0]])+'<span>'+D[r[1]]+'</span><span>·</span><span>'+T[r[4]]+'</span><span>·</span><span>'+M[r[5]]+'</span></div></div>';
    }).join('');
  } else if(F.length){
    tb.innerHTML=pg.map(function(r){
      return '<tr onclick="abrirDetalle('+r[11]+')"><td class="tc">'+fotoDe(r,80)+'</td><td><div class="mod">'+r[2]+'</div><div class="desc">'+r[3]+'</div></td><td>'+badgeFor(C[r[0]])+'</td><td>'
        +D[r[1]]+'</td><td class="dim">'+T[r[4]]+'</td><td>'+M[r[5]]+'</td><td class="n">'+cant(r)+'</td></tr>';
    }).join('');
  }
  renderPag();
}

// celular o escritorio: se decide por el ancho y se vuelve a dibujar al girar el teléfono
var MOVIL=window.matchMedia('(max-width:640px)');
var MODO_DIBUJADO=null;
window.addEventListener('resize',function(){ if(RAW.length && MOVIL.matches!==MODO_DIBUJADO) render(); });
// orden desde el selector del celular: columna + sentido (a = ascendente, d = descendente)
function ordenarMovil(v){
  if(!v) return;
  SC=parseInt(v); SD=v.slice(-1)==='d'?-1:1;
  marcarOrden(); doSort(SC); CP=1; render();
}

function renderPag(){
  var total=Math.ceil(F.length/PS), p=document.getElementById('pg');
  if(total<=1){p.innerHTML='';return;}
  var h='<button onclick="goP('+(CP-1)+')" '+(CP===1?'disabled':'')+'>&#8249;</button>', rng=[];
  for(var i=1;i<=total;i++){
    if(i===1||i===total||(i>=CP-1&&i<=CP+1)) rng.push(i);
    else if(rng[rng.length-1]!=='...') rng.push('...');
  }
  rng.forEach(function(x){
    if(x==='...') h+='<span class="pi">…</span>';
    else h+='<button class="'+(x===CP?'act':'')+'" onclick="goP('+x+')">'+x+'</button>';
  });
  h+='<button onclick="goP('+(CP+1)+')" '+(CP===total?'disabled':'')+'>&#8250;</button>';
  h+='<span class="pi">'+CP+' / '+total+'</span>';
  p.innerHTML=h;
}

function goP(p){
  var total=Math.ceil(F.length/PS);
  if(p<1||p>total) return;
  CP=p; render();
  var y=document.querySelector('.tabla').getBoundingClientRect().top+window.pageYOffset-8;
  window.scrollTo(0,Math.max(0,y));
}

function resetF(){
  ORDEN_FILTROS.forEach(function(id){document.getElementById(id).value='-1';});
  refreshDropdowns();
  document.getElementById('fq').value=''; document.getElementById('fo').value='';
  AT=-1; SI=-1; F=RAW.slice(); SC=-1; SD=1;
  marcarOrden();
  CP=1; render();
}

cargar().catch(function(e){
  var m=document.getElementById('cargando'); m.className='msg err'; m.textContent='No pude cargar los datos: '+e.message;
  document.getElementById('meta').innerHTML='';
});
</script>
